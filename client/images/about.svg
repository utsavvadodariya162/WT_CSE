<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-label="Awareness illustration showing donation, storage and transfusion">
  <defs>
    <linearGradient id="ap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf8f6"/><stop offset="1" stop-color="#f1eae6"/>
    </linearGradient>
    <linearGradient id="bag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4242e"/><stop offset="1" stop-color="#8c0d15"/>
    </linearGradient>
    <pattern id="g2" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#e6ded9" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="760" height="520" fill="url(#ap)"/>
  <rect width="760" height="520" fill="url(#g2)" opacity="0.8"/>

  <!-- three-step arc -->
  <path d="M150 300 Q380 160 610 300" fill="none" stroke="#d9cdc7" stroke-width="1.5" stroke-dasharray="6 8"/>

  <!-- 1. donor arm + needle -->
  <g transform="translate(96 246)">
    <rect x="0" y="18" width="132" height="46" rx="23" fill="#efe2db" stroke="#d9c8c0" stroke-width="1.5"/>
    <path d="M118 41h52" stroke="#7c6f75" stroke-width="3" stroke-linecap="round"/>
    <circle cx="60" cy="41" r="6" fill="#b3121b"/>
    <text x="0" y="-14" font-family="'IBM Plex Mono',monospace" font-size="11" letter-spacing="2.4" fill="#b3121b">01 · DONATE</text>
  </g>

  <!-- 2. blood bag (centre) -->
  <g transform="translate(330 128)">
    <rect x="0" y="0" width="108" height="150" rx="14" fill="url(#bag)"/>
    <rect x="0" y="0" width="108" height="150" rx="14" fill="none" stroke="#7a0910" stroke-width="1.5"/>
    <rect x="14" y="18" width="80" height="34" rx="5" fill="#fbf8f6" opacity="0.92"/>
    <text x="54" y="42" font-family="'IBM Plex Mono',monospace" font-size="19" font-weight="700"
          fill="#b3121b" text-anchor="middle">O+</text>
    <g stroke="#fff" stroke-width="1" opacity="0.3">
      <path d="M14 74h80M14 92h80M14 110h80M14 128h80"/>
    </g>
    <path d="M40 -20h28v20H40z" fill="#efe2db" stroke="#d9c8c0" stroke-width="1.5"/>
    <path d="M54 150v34" stroke="#7c6f75" stroke-width="3" stroke-linecap="round"/>
    <text x="0" y="-38" font-family="'IBM Plex Mono',monospace" font-size="11" letter-spacing="2.4" fill="#b3121b">02 · STORE</text>
  </g>

  <!-- 3. recipient / heart pulse -->
  <g transform="translate(540 236)">
    <rect x="0" y="0" width="140" height="96" rx="10" fill="#fbf8f6" stroke="#d9cdc7" stroke-width="1.5"/>
    <path d="M14 52h26l10-24 14 48 12-34 9 18h32" fill="none" stroke="#b3121b" stroke-width="3"
          stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="-14" font-family="'IBM Plex Mono',monospace" font-size="11" letter-spacing="2.4" fill="#b3121b">03 · TRANSFUSE</text>
  </g>

  <!-- floating drops -->
  <g fill="#b3121b" opacity="0.16">
    <path d="M660 118c0 0 22 24 22 37a22 22 0 0 1-44 0c0-13 22-37 22-37z"/>
    <path d="M110 132c0 0 15 17 15 26a15 15 0 0 1-30 0c0-9 15-26 15-26z"/>
    <path d="M400 420c0 0 18 20 18 31a18 18 0 0 1-36 0c0-11 18-31 18-31z"/>
  </g>

  <path d="M96 452h568" stroke="#e3dad4" stroke-width="1"/>
  <text x="96" y="482" font-family="'IBM Plex Mono',monospace" font-size="12.5"
        letter-spacing="3" fill="#7c6f75">RAKTSETU · A BRIDGE BETWEEN DONOR AND PATIENT</text>
</svg>
