<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="Stylised location map showing RaktSetu office at Marwadi University, Rajkot">
  <defs>
    <pattern id="mg" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#e6ded9" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="640" height="320" fill="#f6f1ee"/>
  <rect width="640" height="320" fill="url(#mg)"/>

  <!-- blocks -->
  <g fill="#eae1db">
    <rect x="40" y="36" width="120" height="78" rx="4"/>
    <rect x="196" y="30" width="92" height="60" rx="4"/>
    <rect x="452" y="44" width="146" height="70" rx="4"/>
    <rect x="52" y="196" width="104" height="86" rx="4"/>
    <rect x="404" y="200" width="184" height="84" rx="4"/>
    <rect x="200" y="222" width="140" height="60" rx="4"/>
  </g>

  <!-- roads -->
  <g stroke="#fbf8f6" stroke-width="14" stroke-linecap="round">
    <path d="M0 160h640"/><path d="M368 0v320"/><path d="M172 0v320"/>
  </g>
  <g stroke="#dcd2cc" stroke-width="1.2" stroke-dasharray="9 9">
    <path d="M0 160h640"/><path d="M368 0v320"/><path d="M172 0v320"/>
  </g>

  <!-- highlighted route to the pin -->
  <path d="M172 268 L172 160 L368 160 L368 120" fill="none" stroke="#b3121b"
        stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

  <!-- pin -->
  <g transform="translate(368 66)">
    <path d="M0 54c0 0 20-24 20-36A20 20 0 0 0-20 18c0 12 20 36 20 36z" fill="#b3121b"/>
    <circle cy="18" r="7.5" fill="#fbf8f6"/>
  </g>

  <g font-family="'IBM Plex Sans',sans-serif" font-size="12" fill="#453b40">
    <rect x="388" y="52" width="196" height="40" rx="5" fill="#fff" stroke="#e3dad4"/>
    <text x="400" y="70" font-weight="600" fill="#1a1417">Marwadi University</text>
    <text x="400" y="85" font-size="11" fill="#7c6f75">Rajkot, Gujarat 360003</text>
  </g>

  <text x="20" y="306" font-family="'IBM Plex Mono',monospace" font-size="10"
        letter-spacing="2.4" fill="#a99ea3">MAP PLACEHOLDER · 22.36 N, 70.80 E</text>
</svg>
