<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Blood donation camp — volunteers at a registration desk">
  <rect width="640" height="360" fill="#f4efee"/>
  <g stroke="#e7dedb" stroke-width="1"><path d="M0 96h640M0 192h640M0 288h640"/></g>

  <!-- banner -->
  <rect x="86" y="46" width="468" height="62" rx="6" fill="#b3121b"/>
  <rect x="102" y="62" width="436" height="30" rx="4" fill="#fbf8f6" opacity="0.14"/>
  <text x="320" y="86" font-family="'IBM Plex Mono',monospace" font-size="17" font-weight="600"
        letter-spacing="4" fill="#fff" text-anchor="middle">DONATE BLOOD</text>
  <g stroke="#a99ea3" stroke-width="4" stroke-linecap="round"><path d="M100 108v34M540 108v34"/></g>

  <!-- registration desk -->
  <rect x="150" y="230" width="340" height="20" rx="4" fill="#fff" stroke="#ddd2cc" stroke-width="1.5"/>
  <rect x="168" y="250" width="12" height="40" fill="#d5c9c3"/>
  <rect x="460" y="250" width="12" height="40" fill="#d5c9c3"/>
  <rect x="228" y="206" width="52" height="24" rx="3" fill="#efe6e2" stroke="#ddd2cc" stroke-width="1.5"/>
  <rect x="356" y="212" width="40" height="18" rx="3" fill="#efe6e2" stroke="#ddd2cc" stroke-width="1.5"/>

  <!-- three volunteers -->
  <g>
    <circle cx="204" cy="172" r="19" fill="#efe4de" stroke="#ddd2cc" stroke-width="1.5"/>
    <path d="M176 230v-26a28 28 0 0 1 56 0v26z" fill="#b3121b"/>
  </g>
  <g>
    <circle cx="320" cy="164" r="21" fill="#efe4de" stroke="#ddd2cc" stroke-width="1.5"/>
    <path d="M289 230v-30a31 31 0 0 1 62 0v30z" fill="#453b40"/>
  </g>
  <g>
    <circle cx="436" cy="172" r="19" fill="#efe4de" stroke="#ddd2cc" stroke-width="1.5"/>
    <path d="M408 230v-26a28 28 0 0 1 56 0v26z" fill="#b3121b"/>
  </g>

  <!-- drops -->
  <g fill="#b3121b" opacity="0.2">
    <path d="M566 160c0 0 16 18 16 28a16 16 0 0 1-32 0c0-10 16-28 16-28z"/>
    <path d="M74 186c0 0 13 14 13 22a13 13 0 0 1-26 0c0-8 13-22 13-22z"/>
  </g>

  <path d="M0 288h640" stroke="#ddd2cc" stroke-width="2"/>
  <text x="28" y="330" font-family="'IBM Plex Mono',monospace" font-size="13"
        letter-spacing="3" fill="#7c6f75">REGISTRATION DESK · WALK-INS WELCOME</text>
</svg>
